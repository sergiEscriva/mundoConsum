name: Tests

on:
  push:
    branches: [main]
    paths: ["scripts/**", "tests/**", "data/categories.json"]
  pull_request:
    branches: [main]
    paths: ["scripts/**", "tests/**", "data/categories.json"]

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v
