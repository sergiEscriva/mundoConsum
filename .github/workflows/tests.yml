name: Tests

on:
  push:
    branches: [main]
    paths: ["scripts/**", "tests/**", "dashboard/**", "run.py", "iniciar.*", "requirements.txt", "data/categories.json", ".github/workflows/**"]
  pull_request:
    branches: [main]
    paths: ["scripts/**", "tests/**", "dashboard/**", "run.py", "iniciar.*", "requirements.txt", "data/categories.json", ".github/workflows/**"]

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install browser for dashboard tests
        run: python -m playwright install --with-deps chromium

      - name: Run tests
        env:
          REQUIRE_BROWSER_TESTS: "1"
        run: pytest tests/ -v
