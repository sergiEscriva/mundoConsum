name: Consum Daily Tracker

on:
  schedule:
    # 06:00 UTC: 08:00 en verano y 07:00 en invierno (Europe/Madrid).
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: consum-daily
  cancel-in-progress: false

jobs:
  update-tracker:
    name: Descargar tickets y actualizar dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Configurar notificaciones opcionales
        id: notifications
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            echo "telegram=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Descargar tickets nuevos
        id: scrape
        env:
          CONSUM_COOKIES: ${{ secrets.CONSUM_COOKIES }}
        run: |
          set +e
          python scripts/scraper.py
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 2 ]; then
            echo "No hay tickets nuevos (exit 2) — ok"
            exit 0
          fi
          if [ "$code" -eq 4 ]; then
            echo "::warning::Tickets descargados con diferencias pendientes de revisión; el dashboard mostrará los avisos."
            exit 0
          fi
          exit $code

      - name: Generar datos del dashboard
        if: ${{ steps.scrape.outputs.exit_code != '2' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: python scripts/build_data.py

      - name: Guardar cambios en el repositorio
        if: ${{ steps.scrape.outputs.exit_code != '2' }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "Sin cambios que guardar hoy."
          elif [ -z "$(git diff --staged -I'"generated_at":' -- data/)" ]; then
            echo "Solo cambió generated_at; se omite el commit vacío."
            git checkout -- data/summary.json
          else
            FECHA=$(date +'%d/%m/%Y')
            git commit -m "Tickets actualizados — $FECHA"
            git pull --rebase origin main
            git push
          fi

      - name: Notificar resumen de compra en Telegram
        if: ${{ steps.scrape.outputs.exit_code == '0' || steps.scrape.outputs.exit_code == '4' }}
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/notify_telegram.py

      - name: Notificar si las cookies expiraron
        if: ${{ failure() && steps.scrape.outputs.exit_code == '1' }}
        run: |
          echo "::error::Las cookies de Consum han expirado."
          echo "::error::Ejecuta localmente: python scripts/get_cookie.py"
          echo "::error::Luego actualiza el Secret CONSUM_COOKIES en GitHub."

      - name: Crear issue automático por cookies expiradas
        if: ${{ failure() && steps.scrape.outputs.exit_code == '1' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create cookies-expired --color D93F0B --description "Renovar sesión de Consum" --force
          existing=$(gh issue list --label "cookies-expired" --state open --json number --jq 'length')
          if [ "$existing" -eq 0 ]; then
            gh issue create \
              --title "Las cookies de Consum han expirado" \
              --body "El scraper ha fallado porque la sesión ha caducado.

          **Pasos para renovar:**
          1. Ejecuta localmente: \`python scripts/get_cookie.py\`
          2. Actualiza el Secret \`CONSUM_COOKIES\` en GitHub.

          _Este issue se ha creado automáticamente._" \
              --label "cookies-expired"
          fi

      - name: Notificar por Telegram (opcional)
        if: ${{ failure() && steps.scrape.outputs.exit_code == '1' && steps.notifications.outputs.telegram == 'true' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          printf 'url = "https://api.telegram.org/bot%s/sendMessage"\n' "$TELEGRAM_BOT_TOKEN" | \
            curl --fail --silent --show-error --config - -X POST \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              -d parse_mode="Markdown" \
              --data-urlencode "text=*Consum Tracker*: Las cookies han expirado. Ejecuta \`python scripts/get_cookie.py\` y actualiza el Secret."

      - name: Informar de fallo de descarga o extracción
        if: ${{ failure() && steps.scrape.outputs.exit_code == '3' }}
        run: echo "::error::Fallo de red, API o extracción incompleta. Revisa los logs; no implica cookies caducadas."
