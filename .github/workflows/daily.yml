name:  Consum Daily Tracker

on:
  schedule:
    # Cada día a las 08:00 hora de España (UTC+2 en verano → 06:00 UTC)
    - cron: "0 6 * * *"
  workflow_dispatch:
    # Permite ejecutarlo manualmente desde GitHub → Actions → Run workflow

jobs:
  update-tracker:
    name: Descargar tickets y actualizar dashboard
    runs-on: ubuntu-latest

    permissions:
      contents: write   # necesario para hacer commit

    steps:
      # ── 1. Clonar el repositorio ───────────────────────────
      - name:  Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. Configurar Python ───────────────────────────────
      - name:  Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # ── 3. Instalar dependencias ───────────────────────────
      - name:  Instalar dependencias
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      # ── 4. Descargar tickets nuevos ────────────────────────
      - name:  Descargar tickets nuevos
        id: scrape
        env:
          CONSUM_COOKIES: ${{ secrets.CONSUM_COOKIES }}
        run: |
          python scripts/scraper.py
          echo "exit_code=$?" >> $GITHUB_OUTPUT
        # exit code 2 = no hay tickets nuevos (no es un error)
        continue-on-error: true

      # ── 5. Generar summary.json ────────────────────────────
      - name:  Generar datos del dashboard
        run: python scripts/build_data.py

      # ── 6. Commit y push si hay cambios ───────────────────
      - name:  Guardar cambios en el repositorio
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          # Solo hace commit si hay cambios reales
          if git diff --staged --quiet; then
            echo "Sin cambios que guardar hoy."
          else
            FECHA=$(date +'%d/%m/%Y')
            git commit -m " Tickets actualizados — $FECHA"
            git push
          fi

      # ── 7. Notificar si las cookies han expirado ───────────
      - name:  Notificar si las cookies expiraron
        if: failure()
        run: |
          echo "::error::Las cookies de Consum han expirado."
          echo "::error::Ejecuta localmente: python scripts/get_cookie.py"
          echo "::error::Luego actualiza el Secret CONSUM_COOKIES en GitHub."
